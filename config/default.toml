# ---------------------------------------------------------------------------------------
# Accounts
# ---------------------------------------------------------------------------------------

# Foundation Billing
[[accounts.arbitrum-one]]
address = "FoundationBillingMultisig"
group   = "billing"
watch   = ["grt"]

  [[accounts.arbitrum-one.allowances]]
  spender = "NetworkMonitor"

# Billing wallet
[[accounts.arbitrum-one]]
address = "BillingWallet"
group   = "billing"
watch   = ["eth", "grt"]

  [accounts.arbitrum-one.activity]
  emitter = "BillingContract"
  event   = "TokensPulled(address,uint256)"

  [[accounts.arbitrum-one.allowances]]
  spender = "NetworkMonitor"


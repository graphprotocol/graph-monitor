# ---------------------------------------------------------------------------------------
# Remediation
# ---------------------------------------------------------------------------------------
#
# Nothing ships enabled. A `remediate` block is the ONE threshold the tool holds, and it
# exists because repair must keep working when the metrics pipeline does not. Note that it
# is deliberately not the alert threshold: top up early, page only if the top-up is not
# keeping up.
#
#   [accounts.arbitrum-one.eth.remediate]
#   below     = "0.05"
#   top_up_by = "0.1"
#   from      = "FoundationBillingMultisig"

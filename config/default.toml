# Shipped configuration, embedded into the binary at build time.
#
# User config extends this file. To adjust one value, set just that value in
# ~/.config/graph-monitor/config.toml — per-key merging keeps everything else.
# To ignore this file entirely, set `use_defaults = false` (or pass --no-defaults).

default_network = "arbitrum-one"

# ---------------------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------------------

[networks.arbitrum-one]
chain_id = 42161
rpc_url = "https://arb1.arbitrum.io/rpc"
# How far behind wall clock the head block may be before the source is called stale.
# Arbitrum blocks are sub-second, so a minute is a couple of orders of magnitude of slack.
max_lag = "60s"
# Requests in flight. Low for the free public endpoint above, which returns 429 well before a
# paid provider would. Activity watches search logs and are latency-bound, so raising this
# against a real endpoint speeds them up almost linearly.
max_concurrency = 6

# Address book. Names here can be used anywhere an address is expected
